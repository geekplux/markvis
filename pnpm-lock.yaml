lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@markvis/cli':
        specifier: workspace:*
        version: link:packages/cli
      '@markvis/ir':
        specifier: workspace:*
        version: link:packages/ir
      '@markvis/markdown-it':
        specifier: workspace:*
        version: link:packages/markdown-it
      '@markvis/parser':
        specifier: workspace:*
        version: link:packages/parser
      '@markvis/remark':
        specifier: workspace:*
        version: link:packages/remark
      '@markvis/render-svg':
        specifier: workspace:*
        version: link:packages/render-svg

  apps/playground: {}

  packages/cli: {}

  packages/compat-legacy: {}

  packages/ir: {}

  packages/markdown-it: {}

  packages/parser: {}

  packages/remark: {}

  packages/render-svg: {}
