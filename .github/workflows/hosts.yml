name: hosts

# Builds every recipe under examples/hosts that has a package.json against
# this branch's markvis and the host versions it pins. Weekly and on demand;
# not a required check.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack markvis
        run: npm pack --ignore-scripts && mv markvis-*.tgz markvis.tgz

      - name: Build each host recipe
        run: |
          status=0
          for pkg in examples/hosts/*/package.json; do
            dir="$(dirname "$pkg")"
            echo "::group::$dir"
            if (cd "$dir" && npm install --no-audit --no-fund && npm run build) \
              && grep -q "<svg" "$dir/dist/index.html"; then
              echo "$dir: ok"
            else
              echo "::error::$dir did not build a page with <svg"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
