name: check

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Check valid
        run: pnpm markvis check examples/valid

      - name: Check invalid (must exit non-zero)
        run: |
          if pnpm markvis check examples/invalid; then
            echo "pnpm markvis check examples/invalid must exit non-zero"
            exit 1
          fi

      - name: Playground build
        run: pnpm --filter playground build
